name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/test.sh
      - run: ./scripts/run.sh --headless --samples 2 --output build/smoke-trips
